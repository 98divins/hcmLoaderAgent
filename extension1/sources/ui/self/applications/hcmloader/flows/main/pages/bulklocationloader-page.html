<oj-sp-general-overview-page id="oj_gop1" display-options.responsive-padding="on" page-title="HCM Loader">
  <div slot="main">
    <oj-c-button label="Ajouter une ligne" id="addRowChain" on-oj-action="[[$listeners.addRowChainAction]]"></oj-c-button>
    <oj-c-file-picker on-oj-select="[[$listeners.filePickerSelect]]"></oj-c-file-picker>
    <oj-c-button label="Générer aperçu HDL" id="generateHdlPreviewButton"
      on-oj-action="[[$listeners.generateHdlPreviewAction]]"></oj-c-button>
  </div>
  <div slot="info">
    <oj-table scroll-policy="loadAll" style="width: 100%; height: 400px;"
      data="[[ $page.functions.getLocationRowsDP($variables.locationRows) ]]"
      columns='[  { "headerText": "Code site", "field": "locationCode", "id": "colLocationCode" },  { "headerText": "Nom", "field": "name", "id": "colName" },  { "headerText": "Date d&apos;effet", "field": "effectiveStartDate", "id": "colEffectiveStartDate" },  { "headerText": "Adresse", "field": "addressLine1", "id": "colAddressLine1" },  { "headerText": "Ville", "field": "townOrCity", "id": "colTownOrCity" },  { "headerText": "Région", "field": "region1", "id": "colRegion1" },  { "headerText": "Code postal", "field": "postalCode", "id": "colPostalCode" },  { "headerText": "Pays", "field": "country", "id": "colCountry" }]'></oj-table>
  </div>
</oj-sp-general-overview-page>
