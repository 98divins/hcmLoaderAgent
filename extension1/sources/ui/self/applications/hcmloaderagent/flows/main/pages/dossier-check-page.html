<div class="hdl-page">

  <header class="hdl-header">
    <div class="hdl-overline oj-typography-body-xs oj-text-color-secondary"><oj-bind-text
      value="[[ $flow.functions.dossierOverline($flow.variables.hierarchy, $flow.variables.operation) ]]"></oj-bind-text></div>
    <div class="hdl-header-row">
      <div>
        <h1 class="oj-typography-heading-md oj-text-color-primary oj-sm-margin-0"><oj-bind-text
          value="[[ $flow.functions.stepTitle('review') ]]"></oj-bind-text></h1>
        <p class="oj-typography-body-md oj-text-color-secondary oj-sm-margin-0 oj-sm-margin-1x-top hdl-subtitle"><oj-bind-text
          value="[[ $flow.functions.stepSubtitle('review') ]]"></oj-bind-text></p>
      </div>
      <div class="hdl-header-actions">
        <oj-c-button label="[[ $flow.variables.assistOpen ? 'Masquer l\'assistant' : 'Assistant' ]]"
                     chroming="outlined" button-type="button"
                     on-oj-action="[[ $listeners.onToggleAssist ]]"></oj-c-button>
        <oj-c-button label="Abandonner le dossier" chroming="borderless" button-type="button"
                     disabled="[[ $flow.variables.isChecking || $flow.variables.isThinking ]]"
                     on-oj-action="[[ $listeners.onAbandon ]]"></oj-c-button>
      </div>
    </div>
  </header>

  <div class="hdl-train">
    <oj-c-train steps="[[ $flow.functions.getTrainSteps('review') ]]" selected-step="review"></oj-c-train>
  </div>

  <!-- Le contenu a gauche, l'assistant dans un tiroir a droite : le tiroir
       Redwood se replie sans rien cacher du dossier. -->
  <oj-c-drawer-layout class="hdl-main" end-opened="{{ $flow.variables.assistOpen }}" end-display="reflow">

    <div class="hdl-content">

      <div class="oj-sm-margin-3x-bottom">
        <oj-c-message-banner data="[[ $flow.functions.getBannersDP($flow.variables.checkSummary, $flow.variables.operation, $flow.variables.hasAutoFix, $flow.variables.hasProposal) ]]"
                             type="section"></oj-c-message-banner>
      </div>

      <oj-bind-if test="[[ $flow.variables.summaryText ]]">
        <div class="oj-typography-body-sm oj-text-color-secondary oj-sm-margin-2x-bottom"><oj-bind-text value="[[ $flow.variables.summaryText ]]"></oj-bind-text></div>
      </oj-bind-if>

      <div class="hdl-tabs" on-click="[[ $listeners.onSelectSheet ]]">
        <oj-bind-for-each data="[[ $flow.functions.getSheets($flow.variables.sheets, $flow.variables.activeSheet) ]]">
          <template>
            <div :class="[[ $current.data.cls ]]" :data-sheet="[[ $current.data.index ]]" role="tab">
              <span :class="[[ $current.data.dot ]]"></span>
              <span class="oj-typography-body-sm oj-sm-margin-1x-start"><oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text></span>
              <span class="oj-typography-body-xs oj-text-color-secondary oj-sm-margin-2x-start"><oj-bind-text value="[[ $current.data.detail ]]"></oj-bind-text></span>
            </div>
          </template>
        </oj-bind-for-each>
        <span class="oj-typography-body-xs oj-text-color-secondary oj-sm-margin-3x-start oj-sm-flex-1">Double-clic
          sur une ligne pour la corriger, Entree pour valider.</span>
      </div>

      <oj-c-table class="hdl-table"
                  data="[[ $flow.functions.getRowsDP($flow.variables.sheets, $flow.variables.activeSheet) ]]"
                  columns="[[ $flow.functions.getTableColumns($flow.variables.sheets, $flow.variables.activeSheet, 'review') ]]"
                  layout="fixed"
                  edit-mode="rowEdit"
                  vertical-grid-visible="enabled"
                  on-oj-before-row-edit-end="[[ $listeners.onRowEditEnd ]]">
        <template slot="editCell">
          <oj-c-input-text value="{{ $current.item.data[$current.columnKey] }}"
                           label-hint="[[ $current.columnKey ]]" label-edge="none"
                           :data-column="[[ $current.columnKey ]]"></oj-c-input-text>
        </template>
      </oj-c-table>

      <oj-bind-if test="[[ $flow.variables.errorText && !$flow.variables.assistOpen ]]">
        <div class="hdl-error oj-typography-body-sm oj-sm-padding-2x oj-sm-margin-3x-top"><oj-bind-text value="[[ $flow.variables.errorText ]]"></oj-bind-text></div>
      </oj-bind-if>

    </div>

    <!-- Assistant : sa derniere reponse, ses propositions applicables ou
         ignorables, et une question. Rien ne modifie le dossier sans geste
         explicite. -->
    <div slot="end" class="hdl-assist">
      <div class="hdl-assist-head">
        <span class="oj-typography-body-md oj-typography-semi-bold oj-text-color-primary oj-sm-flex-1">Assistant</span>
        <span class="oj-typography-body-xs oj-text-color-secondary"><oj-bind-text value="[[ $flow.functions.olderTurns($flow.variables.turns) ]]"></oj-bind-text></span>
      </div>

      <div class="hdl-assist-thread">

        <oj-bind-if test="[[ $flow.variables.hasAutoFix ]]">
          <div class="hdl-proposal oj-sm-padding-3x oj-sm-margin-3x-bottom">
            <div class="oj-typography-body-xs oj-typography-semi-bold oj-sm-margin-1x-bottom">CORRECTIONS CERTAINES</div>
            <div class="oj-typography-body-sm hdl-pre"><oj-bind-text value="[[ $flow.variables.autoFixText ]]"></oj-bind-text></div>
            <div class="oj-flex oj-sm-margin-2x-top">
              <oj-c-button label="Appliquer" button-type="button" size="sm" chroming="callToAction"
                           disabled="[[ $flow.variables.isChecking ]]"
                           on-oj-action="[[ $listeners.onApplyAutoFix ]]"></oj-c-button>
              <oj-c-button label="Ignorer" button-type="button" size="sm" chroming="outlined"
                           class="oj-sm-margin-2x-start"
                           on-oj-action="[[ $listeners.onIgnoreAutoFix ]]"></oj-c-button>
            </div>
          </div>
        </oj-bind-if>

        <oj-bind-if test="[[ $flow.variables.hasProposal ]]">
          <div class="hdl-proposal oj-sm-padding-3x oj-sm-margin-3x-bottom">
            <div class="oj-typography-body-xs oj-typography-semi-bold oj-sm-margin-1x-bottom">PROPOSITION DE L'ASSISTANT</div>
            <div class="oj-typography-body-sm hdl-pre"><oj-bind-text value="[[ $flow.variables.proposalText ]]"></oj-bind-text></div>
            <div class="oj-flex oj-sm-margin-2x-top">
              <oj-c-button label="Appliquer" button-type="button" size="sm" chroming="callToAction"
                           disabled="[[ $flow.variables.isChecking ]]"
                           on-oj-action="[[ $listeners.onApplyProposal ]]"></oj-c-button>
              <oj-c-button label="Ignorer" button-type="button" size="sm" chroming="outlined"
                           class="oj-sm-margin-2x-start"
                           on-oj-action="[[ $listeners.onIgnoreProposal ]]"></oj-c-button>
            </div>
          </div>
        </oj-bind-if>

        <oj-bind-if test="[[ $flow.variables.appliedNote ]]">
          <div class="oj-typography-body-xs oj-text-color-secondary oj-sm-margin-3x-bottom"><oj-bind-text
            value="[[ $flow.variables.appliedNote ]]"></oj-bind-text></div>
        </oj-bind-if>

        <oj-bind-if test="[[ $flow.variables.isThinking ]]">
          <div class="oj-flex oj-sm-align-items-center oj-sm-margin-3x-bottom">
            <oj-c-progress-circle value="-1" size="sm"></oj-c-progress-circle>
            <span class="oj-typography-body-xs oj-text-color-secondary oj-sm-margin-2x-start"><oj-bind-text value="[[ $flow.variables.currentStep ]]"></oj-bind-text></span>
          </div>
        </oj-bind-if>

        <oj-bind-if test="[[ !$flow.variables.isThinking && $flow.functions.lastTurn($flow.variables.turns) ]]">
          <div class="oj-sm-margin-3x-bottom">
            <div class="hdl-pre oj-typography-body-sm oj-text-color-primary"><oj-bind-text value="[[ $flow.functions.lastTurn($flow.variables.turns).answer ]]"></oj-bind-text></div>
            <div class="oj-typography-body-xs oj-text-color-secondary oj-sm-margin-1x-top"><oj-bind-text value="[[ $flow.functions.lastTurn($flow.variables.turns).meta ]]"></oj-bind-text></div>
          </div>
        </oj-bind-if>

        <oj-bind-if test="[[ !$flow.variables.isThinking && !$flow.functions.lastTurn($flow.variables.turns) && !$flow.variables.hasProposal && !$flow.variables.hasAutoFix ]]">
          <div class="oj-typography-body-sm oj-text-color-secondary">L'assistant lit le dossier a
            chaque controle et apres chaque chargement. Il explique les anomalies et propose des
            corrections, que vous appliquez ou non.</div>
        </oj-bind-if>

        <oj-bind-if test="[[ $flow.variables.errorText ]]">
          <div class="hdl-error oj-typography-body-sm oj-sm-padding-2x"><oj-bind-text value="[[ $flow.variables.errorText ]]"></oj-bind-text></div>
        </oj-bind-if>

      </div>

      <div class="hdl-assist-composer">
        <oj-c-input-text label-hint="Question" label-edge="none"
                         placeholder="Une question sur ce dossier ?"
                         value="{{ $flow.variables.question }}"
                         disabled="[[ $flow.variables.isThinking ]]"
                         on-keyup="[[ $listeners.onAsk ]]"></oj-c-input-text>
        <div class="oj-flex oj-sm-margin-2x-top">
          <oj-bind-if test="[[ !$flow.variables.isThinking ]]">
            <oj-c-button label="Envoyer" button-type="button" size="sm"
                         disabled="[[ !$flow.variables.question ]]"
                         on-oj-action="[[ $listeners.onAsk ]]"></oj-c-button>
          </oj-bind-if>
          <oj-bind-if test="[[ $flow.variables.isThinking ]]">
            <oj-c-button label="Arreter" button-type="button" size="sm" chroming="outlined"
                         on-oj-action="[[ $listeners.onStop ]]"></oj-c-button>
          </oj-bind-if>
        </div>
      </div>
    </div>

  </oj-c-drawer-layout>

  <footer class="hdl-footer">
    <span class="oj-typography-body-xs oj-text-color-secondary"><oj-bind-text value="[[ $flow.functions.stepCounter('review') ]]"></oj-bind-text></span>
    <div class="hdl-footer-right">
      <oj-bind-if test="[[ $flow.variables.isChecking ]]">
        <oj-c-progress-circle value="-1" size="sm"></oj-c-progress-circle>
        <span class="oj-typography-body-sm oj-text-color-secondary oj-sm-margin-2x-end">Controle en cours...</span>
      </oj-bind-if>
      <oj-c-button label="Retour a l'import" button-type="button" size="lg" chroming="borderless"
                   disabled="[[ $flow.variables.isChecking ]]"
                   on-oj-action="[[ $listeners.onBackToImport ]]"></oj-c-button>
      <oj-c-button label="Recontroler" button-type="button" size="lg" chroming="outlined"
                   disabled="[[ $flow.variables.isChecking || $flow.variables.isThinking ]]"
                   on-oj-action="[[ $listeners.onCheck ]]"></oj-c-button>
      <oj-c-button label="Continuer vers le chargement" button-type="button" size="lg" chroming="callToAction"
                   disabled="[[ $flow.variables.step !== 'submit' || $flow.variables.countIssues > 0 || $flow.variables.isChecking ]]"
                   on-oj-action="[[ $listeners.onContinue ]]"></oj-c-button>
    </div>
  </footer>

</div>

<style>
  /* Chrome commun aux pages du flux : en-tete, train, contenu, pied de page. */
  .hdl-page {
    display: flex;
    flex-direction: column;
    min-block-size: calc(100vh - 6rem);
    background-color: var(--oj-core-bg-color-content);
  }

  .hdl-header {
    flex: none;
    padding: 1.25rem 1.5rem 1rem;
    border-bottom: 1px solid var(--oj-core-divider-color);
  }

  .hdl-overline {
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.25rem;
  }

  .hdl-header-row {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
  }

  .hdl-header-actions {
    margin-inline-start: auto;
    display: flex;
    gap: 0.5rem;
    flex: none;
  }

  .hdl-train {
    flex: none;
    padding: 0.5rem 1.5rem;
    border-bottom: 1px solid var(--oj-core-divider-color);
  }

  .hdl-main {
    flex: 1 1 auto;
    min-block-size: 0;
  }

  .hdl-content {
    flex: 1 1 auto;
    padding: 1.5rem;
    min-inline-size: 0;
  }

  .hdl-footer {
    position: sticky;
    bottom: 0;
    z-index: 2;
    flex: none;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1.5rem;
    border-top: 1px solid var(--oj-core-divider-color);
    background-color: var(--oj-core-bg-color-content);
  }

  .hdl-footer-right {
    margin-inline-start: auto;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .hdl-subtitle {
    max-inline-size: 44rem;
  }

  /* Onglets de feuilles au-dessus de la grille, a la Redwood : trait sous
     l'onglet courant, point de couleur pour l'etat de la feuille. */
  .hdl-tabs {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--oj-core-divider-color);
    margin-bottom: 0.75rem;
  }

  .hdl-tab {
    display: inline-flex;
    align-items: center;
    padding: 0.625rem 0.75rem;
    border-bottom: 3px solid transparent;
    cursor: pointer;
  }

  .hdl-tab:hover {
    background-color: var(--oj-core-bg-color-subtle);
  }

  .hdl-tab-courante {
    border-bottom-color: var(--oj-core-text-color-primary);
  }

  .hdl-dot {
    display: inline-block;
    inline-size: 0.5rem;
    block-size: 0.5rem;
    border-radius: 50%;
    background-color: var(--oj-core-divider-color);
    flex: none;
  }

  .hdl-dot-ok { background-color: var(--oj-core-success-3, #197a56); }
  .hdl-dot-anomalie { background-color: var(--oj-core-danger-3, #c74634); }

  /* La grille prend la hauteur qui reste et defile elle-meme, dans les deux
     sens : la page ne grandit jamais au point de perdre son pied de page. */
  .hdl-table {
    inline-size: 100%;
    block-size: max(16rem, calc(100vh - 32rem));
  }

  /* Tiroir de l'assistant : une colonne, la question toujours en bas. */
  .hdl-assist {
    display: flex;
    flex-direction: column;
    inline-size: 24rem;
    max-inline-size: 100vw;
    block-size: 100%;
    min-block-size: 24rem;
    border-inline-start: 1px solid var(--oj-core-divider-color);
    background-color: var(--oj-core-bg-color-content);
  }

  .hdl-assist-head {
    display: flex;
    align-items: center;
    padding: 1rem 1rem 0.75rem;
    border-bottom: 1px solid var(--oj-core-divider-color);
  }

  .hdl-assist-thread {
    flex: 1 1 auto;
    min-block-size: 0;
    overflow-y: auto;
    padding: 1rem;
  }

  .hdl-assist-composer {
    flex: none;
    padding: 0.75rem 1rem 1rem;
    border-top: 1px solid var(--oj-core-divider-color);
  }

  .hdl-proposal {
    background-color: var(--oj-core-bg-color-subtle);
    border: 1px solid var(--oj-core-divider-color);
    border-radius: var(--oj-core-border-radius-md);
  }

  .hdl-pre {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .hdl-error {
    border: 1px solid var(--oj-core-danger-3, #c74634);
    border-radius: var(--oj-core-border-radius-md);
    background-color: var(--oj-core-bg-color-subtle);
  }
</style>
